<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Loop — a JavaScript demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0f;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }

  .container {
    max-width: 560px;
    width: 100%;
  }

  h1 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: #888;
    font-size: 15px;
    margin-bottom: 32px;
  }

  .display {
    background: #14141c;
    border: 1px solid #22222e;
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .label {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .counter {
    font-size: 72px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  .status {
    font-size: 14px;
    color: #6c6c78;
  }

  .status.running { color: #6ee7b7; }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    background: #14141c;
    color: #e8e8ea;
    border: 1px solid #22222e;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover {
    background: #1c1c26;
    border-color: #2c2c38;
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: #6ee7b7;
    color: #0a0a0f;
    border-color: #6ee7b7;
    font-weight: 500;
  }

  button.primary:hover {
    background: #5dd5a5;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #14141c;
    border: 1px solid #22222e;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }

  .slider-row label {
    font-size: 14px;
    color: #888;
    min-width: 60px;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #2c2c38;
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: #6ee7b7;
    border-radius: 50%;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: #6ee7b7;
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .slider-value {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    min-width: 80px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .code {
    background: #14141c;
    border: 1px solid #22222e;
    border-radius: 12px;
    padding: 20px 24px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.8;
    color: #c0c0c8;
    overflow-x: auto;
  }

  .code .comment { color: #5a5a64; }
  .code .keyword { color: #c084fc; }
  .code .number { color: #6ee7b7; }
  .code .string { color: #fbbf24; }

  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 13px;
    color: #5a5a64;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Time Loop</h1>
    <p class="subtitle">A simple JavaScript loop running on a timer.</p>

    <div class="display">
      <div class="label">Counter</div>
      <div class="counter" id="counter">0</div>
      <div class="status" id="status">Stopped</div>
    </div>

    <div class="slider-row">
      <label>Speed</label>
      <input type="range" min="100" max="2000" step="100" value="1000" id="speed">
      <span class="slider-value" id="speed-value">1000 ms</span>
    </div>

    <div class="controls">
      <button class="primary" id="start-btn">Start</button>
      <button id="stop-btn">Stop</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div class="code">
      <span class="comment">// runs every <span id="ms-display">1000</span> milliseconds</span><br>
      <span class="keyword">const</span> id = <span class="keyword">setInterval</span>(() => {<br>
      &nbsp;&nbsp;count = count + <span class="number">1</span>;<br>
      }, <span class="number" id="ms-display-2">1000</span>);
    </div>

    <div class="footer">Built with vanilla JavaScript · setInterval()</div>
  </div>

<script>
  let count = 0;
  let intervalId = null;
  let ms = 1000;

  const counterEl = document.getElementById('counter');
  const statusEl = document.getElementById('status');
  const speedEl = document.getElementById('speed');
  const speedValue = document.getElementById('speed-value');
  const msDisplay = document.getElementById('ms-display');
  const msDisplay2 = document.getElementById('ms-display-2');

  function start() {
    if (intervalId !== null) return;
    intervalId = setInterval(() => {
      count = count + 1;
      counterEl.textContent = count;
    }, ms);
    statusEl.textContent = 'Running every ' + ms + ' ms';
    statusEl.classList.add('running');
  }

  function stop() {
    if (intervalId === null) return;
    clearInterval(intervalId);
    intervalId = null;
    statusEl.textContent = 'Stopped';
    statusEl.classList.remove('running');
  }

  function reset() {
    stop();
    count = 0;
    counterEl.textContent = '0';
  }

  document.getElementById('start-btn').addEventListener('click', start);
  document.getElementById('stop-btn').addEventListener('click', stop);
  document.getElementById('reset-btn').addEventListener('click', reset);

  speedEl.addEventListener('input', (e) => {
    ms = parseInt(e.target.value);
    speedValue.textContent = ms + ' ms';
    msDisplay.textContent = ms;
    msDisplay2.textContent = ms;
    if (intervalId !== null) {
      stop();
      start();
    }
  });
</script>
</body>
</html>
